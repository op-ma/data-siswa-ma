<header><div class="hd"><img class="logo" src="icon-192.png" alt="Logo"><div><h1>Dashboard Data Siswa MA Al-Ma'tuq</h1><small>Tahun Ajaran 2026/2027</small><small id="sub">Memuat data…</small></div></div>

<script>
// ====== KONFIGURASI ======
const SHEET_ID='1khNpDumFu70ODoqPRqgSoRYVBA4j1rPtno4pkGB51VE';
const GID='0'; // ganti jika data ada di tab lain
const TA='2026/2027';
const URL_CSV=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;
const ORDER_INC=['Tidak Ada','Kurang dari 500.000','500.000 - 1.000.000','1.000.001 - 2.000.000','2.000.001 - 3.000.000','3.000.001 - 5.000.000','Lebih dari 5.000.000'];
const TING=['X','XI','XII'];
let ALL=[],mk='Semua',tab='siswa',curList=[];
const $=s=>document.querySelector(s);
function csv(t){const r=[];let w=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){w.push(f);f='';}else if(c=='\n'){w.push(f);r.push(w);w=[];f=''}else if(c!='\r')f+=c}if(f||w.length){w.push(f);r.push(w)}return r}
function build(rows){const h=rows[0].map(x=>x.trim());return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]||'').trim());return o}).filter(o=>o['Nama']).map(o=>{o['Nama']=o['Nama'].toUpperCase();
 const s=o['Sekolah'].toLowerCase().replace(/[’`]/g,"'");
 if(!/^ma\s/.test(s)||!s.includes('tuq'))return null;
 o._mk=s.includes('zamil')?'Al-Zamil':s.includes('bassam')?'Al-Bassam':s.includes('afaf')?'Al-Afaf':"Al-Ma'tuq";
 if(o._mk=='Al-Bassam'&&o['Tingkat']!='XII')return null;
 if(o['Tahun Ajaran']&&o['Tahun Ajaran']!=TA)return null;
 if(o['Status']&&o['Status']!='Aktif')return null;
 return o}).filter(Boolean)}
// ====== WALI KELAS ======
// Cara 1: buat tab baru di spreadsheet (kolom: Markaz | Kelas | Wali Kelas), isi gid-nya di sini. Contoh: const WALI_GID='123456789';
const WALI_GID='';
// Cara 2: isi manual. Contoh: {"Al-Zamil|10 F":"Ustadzah Fulanah","Al-Ma'tuq|10 A":"Ustadz Fulan"}
const WALI_MANUAL={};
let WALI={};
const kn=k=>(k||'').toLowerCase().replace(/\s+/g,'');
function mn(m){m=(m||'').toLowerCase();return m.includes('zamil')?'alzamil':m.includes('bassam')?'albassam':m.includes('afaf')?'alafaf':m.includes('tuq')?'almatuq':''}
const wali=(m,k)=>WALI[mn(m)+'|'+kn(k)]||WALI['|'+kn(k)]||'';
async function loadWali(){WALI={};try{
 if(WALI_GID!==''){let rows;try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${WALI_GID}`);if(!r.ok)throw 0;const t=await r.text();if(t.trim().startsWith('<'))throw 0;rows=csv(t);localStorage.setItem('ma_wali',JSON.stringify(rows))}catch(e){rows=JSON.parse(localStorage.getItem('ma_wali')||'[]')}
  if(rows.length){const h=rows[0].map(x=>x.trim().toLowerCase()),ik=h.indexOf('kelas'),iw=h.findIndex(x=>x.startsWith('wali')),im=h.findIndex(x=>x.startsWith('markaz')||x=='sekolah');
   rows.slice(1).forEach(r=>{const k=(r[ik]||'').trim(),w=(r[iw]||'').trim();if(k&&w)WALI[mn(im>=0?r[im]:'')+'|'+kn(k)]=w})}}
 Object.entries(WALI_MANUAL).forEach(([k,v])=>{const p=k.split('|'),c=p.pop();WALI[mn(p[0]||'')+'|'+kn(c)]=v})}catch(e){}}
async function load(){const wp=loadWali();
 try{const r=await fetch(URL_CSV);if(!r.ok)throw 0;const t=await r.text();if(t.trim().startsWith('<'))throw 0;
  ALL=build(csv(t));localStorage.setItem('ma_cache',JSON.stringify({t:Date.now(),d:ALL}));await wp;done('Diperbarui '+new Date().toLocaleString('id-ID'))}
 catch(e){const c=localStorage.getItem('ma_cache');if(c){const j=JSON.parse(c);ALL=j.d;ALL.forEach(x=>x['Nama']=x['Nama'].toUpperCase());await wp;done('Offline · data tersimpan '+new Date(j.t).toLocaleString('id-ID'))}
  else $('#app').innerHTML='<div class="msg">Gagal memuat data. Pastikan Google Sheet dibagikan "Siapa saja yang memiliki link (Viewer)" lalu tekan Muat Ulang.</div>'}}
function setNav(){const n=$('nav');if(n)document.documentElement.style.setProperty('--navh',n.offsetHeight+'px')}
function done(s){$('#sub').textContent=s;setNav();render()}
const data=()=>mk=='Semua'?ALL:ALL.filter(x=>x._mk==mk);
function group(list,fn){const m={};list.forEach(x=>{const k=fn(x)||'Tidak diisi';(m[k]=m[k]||[]).push(x)});return m}
const SORT={},CARDS={};
const cmp=(a,b)=>(typeof a=='number'&&typeof b=='number')?a-b:String(a==null?'':a).localeCompare(String(b==null?'':b),'id',{numeric:true,sensitivity:'base'});
const sid=t=>'c'+t.replace(/[^a-z0-9]/gi,'');
function th(id,i,label,cls){const s=SORT[id],on=s&&s.c===i;return `<th class="so${on?' on':''}${cls?' '+cls:''}" onclick="srt('${id}',${i})">${label}<i>${on?(s.d>0?'▲':'▼'):'⇅'}</i></th>`}
function srt(id,i){const s=SORT[id];SORT[id]=s&&s.c===i?{c:i,d:-s.d}:{c:i,d:1};redraw(id)}
function srtSel(id,i){SORT[id]={c:+i,d:(SORT[id]||{d:1}).d};redraw(id)}
function srtDir(id){const s=SORT[id]||{c:2,d:1};SORT[id]={c:s.c,d:-s.d};redraw(id)}
function redraw(id){if(id=='lst')return drawM();if(id=='dl')return drawDl();const el=document.getElementById(id);if(!el||!CARDS[id])return;
 const sc=el.querySelector('.scroll'),y=sc?sc.scrollTop:0;el.outerHTML=CARDS[id]();const n=document.getElementById(id).querySelector('.scroll');if(n)n.scrollTop=y}
function bars(title,m,opt={}){let e0=Object.entries(m);const k=opt.order,id=sid(title);
 e0.sort(k?(a,b)=>(k.indexOf(a[0])<0?99:k.indexOf(a[0]))-(k.indexOf(b[0])<0?99:k.indexOf(b[0])):(a,b)=>b[1].length-a[1].length);
 CARDS[id]=()=>{const s=SORT[id];let e=e0.slice();if(s)e.sort((a,b)=>s.d*(s.c==0?cmp(a[0],b[0]):a[1].length-b[1].length));window['_'+id]=e;
  const mx=Math.max(1,...e.map(x=>x[1].length)),q=t=>t.replace(/'/g,"\\'"),hd=(c,l)=>{const on=SORT[id]&&SORT[id].c===c;return `<span class="so${on?' on':''}" onclick="srt('${id}',${c})">${l}<i>${on?(SORT[id].d>0?'▲':'▼'):'⇅'}</i></span>`};
  return `<div class="card" id="${id}"><h3>${esc(title)}</h3><div class="bh">${hd(0,'Kategori')}${hd(1,'Jumlah')}</div><div class="${e.length>9?'scroll':''}">${e.map((x,i)=>`<div class="row" onclick="${esc(`openM('${q(title)} — ${q(x[0])}',window._${id}[${i}][1])`)}"><span class="l">${esc(x[0])}</span><span class="tr"><i style="width:${x[1].length/mx*100}%"></i></span><span class="n">${x[1].length}</span></div>`).join('')}</div></div>`};
 return CARDS[id]()}
const markazCard=d=>xtab('Siswa per Markaz & Tingkat',d,x=>'Markaz '+x._mk,["Markaz Al-Ma'tuq",'Markaz Al-Zamil','Markaz Al-Afaf','Markaz Al-Bassam'],'Markaz');
function eduRank(v){v=(v||'').toLowerCase().replace(/[.\s]+/g,' ').trim();
 if(/tidak (pernah )?sekolah|belum sekolah|tidak ada|tidak tamat/.test(v))return 0;
 if(/putus/.test(v))return 1;
 if(/\bsp ?-?\d|spesialis|profesi/.test(v))return 12;
 if(/\bs ?-?3\b|doktor/.test(v))return 11;
 if(/\bs ?-?2\b|magister/.test(v))return 10;
 if(/\bs ?-?1\b|sarjana/.test(v))return 9;
 if(/\bd ?-?(4|iv)\b/.test(v))return 8;
 if(/\bd ?-?(3|iii)\b/.test(v))return 7;
 if(/\bd ?-?(2|ii)\b/.test(v))return 6;
 if(/\bd ?-?(1|i)\b/.test(v))return 5;
 if(/paket c|\bsma\b|\bsmk\b|\bman\b|\bma\b|slta/.test(v))return 4;
 if(/paket b|\bsmp\b|\bmts\b|sltp/.test(v))return 3;
 if(/paket a|\bsd\b|\bmi\b/.test(v))return 2;
 return 99}
function xtab(title,list,fn,order,first){const g=group(list,fn);let e=Object.entries(g);
 e.sort(typeof order=='function'?(a,b)=>order(a[0])-order(b[0])||b[1].length-a[1].length:order?(a,b)=>(order.indexOf(a[0])<0?99:order.indexOf(a[0]))-(order.indexOf(b[0])<0?99:order.indexOf(b[0])):(a,b)=>b[1].length-a[1].length);
 e.push(['Total',list]);const n=window._xt.length,id=sid(title);window._xt.push({title,rows:e});
 const val=(r,c)=>c==0?r[0]:c==4?r[1].length:r[1].filter(x=>x['Tingkat']==TING[c-1]).length;
 CARDS[id]=()=>{const s=SORT[id];let o=e.slice(0,-1).map((r,i)=>i);if(s)o.sort((a,b)=>s.d*cmp(val(e[a],s.c),val(e[b],s.c)));o.push(e.length-1);
  const c=(i,t,a)=>a.length?`<td class="c" onclick="openX(${n},${i},'${t}')">${a.length}</td>`:'<td class="z">-</td>';
  return `<div class="card" id="${id}"><h3>${esc(title)}</h3><div class="${e.length>10?'scroll':''}"><table class="xt"><tr>${th(id,0,first||'Kategori')}${TING.map((t,j)=>th(id,j+1,t)).join('')}${th(id,4,'Total')}</tr>${o.map(i=>{const r=e[i];return `<tr${r[0]=='Total'?' class="tot"':''}><td>${esc(r[0])}</td>${TING.map(t=>c(i,t,r[1].filter(x=>x['Tingkat']==t))).join('')}${c(i,'',r[1])}</tr>`}).join('')}</table></div></div>`};
 return CARDS[id]()}
function openX(id,i,t){const x=window._xt[id],r=x.rows[i];openM(x.title+' — '+(r[0]=='Total'?'Semua':r[0])+(t?' · Kelas '+t:''),r[1].filter(y=>!t||y['Tingkat']==t))}
function kelasCard(d){window._kd=d;const g=group(d,x=>x._mk+'|'+(x['Kelas']||'Tanpa kelas'));window._kg=g;
 const keys=Object.keys(g).sort((a,b)=>{const [ma,ka]=a.split('|'),[mb,kb]=b.split('|');return parseInt(ka)-parseInt(kb)||ka.localeCompare(kb)||ma.localeCompare(mb)});window._kk=keys;const id='cKelas';
 const cnt=(a,f)=>a.filter(x=>x['Gender']==f).length;
 const kv=keys.map(k=>{const [m,c]=k.split('|'),b=g[k];return [c,m,cnt(b,'L'),cnt(b,'P'),b.length]});
 const cell=(v,fn)=>v?`<td class="c" onclick="${fn}">${v}</td>`:'<td class="z">-</td>';
 const ts=[...TING,...[...new Set(d.map(x=>x['Tingkat']))].filter(t=>t&&!TING.includes(t))];
 CARDS[id]=()=>{const s=SORT[id];let rows='';
  ts.forEach(t=>{const idx=keys.map((k,i)=>i).filter(i=>g[keys[i]][0]['Tingkat']==t);if(!idx.length)return;if(s)idx.sort((a,b)=>s.d*cmp(kv[a][s.c],kv[b][s.c]));const a=d.filter(x=>x['Tingkat']==t);
   rows+=`<tr class="sub"><td colspan="2">Kelas ${esc(t)}</td>${cell(cnt(a,'L'),`openT('${t}','L')`)}${cell(cnt(a,'P'),`openT('${t}','P')`)}${cell(a.length,`openT('${t}','')`)}</tr>`;
   idx.forEach(i=>{const [c,m,l,p,n]=kv[i];rows+=`<tr><td>${esc(c)}${wali(m,c)?`<small class="wk">Wali Kelas: ${esc(wali(m,c))}</small>`:''}</td><td>${esc(m)}</td>${cell(l,`openK(${i},'L')`)}${cell(p,`openK(${i},'P')`)}${cell(n,`openK(${i},'')`)}</tr>`})});
  rows+=`<tr class="tot"><td colspan="2">Total</td>${cell(cnt(d,'L'),"openT('','L')")}${cell(cnt(d,'P'),"openT('','P')")}${cell(d.length,"openT('','')")}</tr>`;
  return `<div class="card" id="${id}"><h3>Siswa per Kelas &amp; Jenis Kelamin</h3><div class="scroll"><table class="xt"><tr>${th(id,0,'Kelas')}${th(id,1,'Markaz')}${th(id,2,'L','L')}${th(id,3,'P','P')}${th(id,4,'Total')}</tr>${rows}</table></div></div>`};
 return CARDS[id]()}
const JK=f=>f=='L'?'Laki-laki':'Perempuan';
function openK(i,f){const k=window._kk[i];openM('Kelas '+k.split('|')[1]+' · '+k.split('|')[0]+(f?' · '+JK(f):''),window._kg[k].filter(x=>!f||x['Gender']==f),wali(k.split('|')[0],k.split('|')[1])?'Wali Kelas: '+wali(k.split('|')[0],k.split('|')[1]):'')}
function openT(t,f){openM((t?'Kelas '+t:'Semua Kelas')+(f?' · '+JK(f):''),window._kd.filter(x=>(!t||x['Tingkat']==t)&&(!f||x['Gender']==f)))}
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t==tab));$('#cs').classList.toggle('on',tab=='cari');$('#mkSel').disabled=tab=='cari';$('#chips .sel').style.opacity=tab=='cari'?.45:1;if(tab=='cari')return renderCari();const d=data();let h='';window._xt=[];
 const L=d.filter(x=>x['Gender']=='L'),P=d.filter(x=>x['Gender']=='P');window._k=[['Total Siswa',d],['Laki-laki',L],['Perempuan',P]];
 h+=`<div class="kpi">${window._k.map((k,i)=>`<div class="k" onclick="openM('${k[0]}',window._k[${i}][1])"><b>${k[1].length}</b><span>${k[0]}</span></div>`).join('')}</div><div class="grid">`;
 if(tab=='siswa'){h+=markazCard(d);
  h+=bars('Siswa per Tingkat',group(d,x=>'Kelas '+x['Tingkat']),{order:TING.map(t=>'Kelas '+t)});h+=kelasCard(d);window._dl=d.slice().sort((a,b)=>a['Nama'].localeCompare(b['Nama']));h+=`<div class="card full" id="dlc"><h3>Detail Siswa · ${d.length} siswa</h3><div id="dlw"></div></div>`}
 if(tab=='ortu'){for(const [t,f,o] of [['Pendidikan','Pendidikan',eduRank],['Pekerjaan','Pekerjaan'],['Penghasilan','Penghasilan',ORDER_INC]])
  for(const w of ['Ayah','Ibu'])h+=xtab(`${t} ${w}`,d,x=>x[f+' '+w],o,t)}
 if(tab=='yatim'){const y=d.filter(x=>x['Status Yatim']=='Ya');
  h+=bars('Siswa Yatim',group(d,x=>x['Status Yatim']=='Ya'?(x['Jenis Yatim']||'Yatim'):'Bukan Yatim'));
  h+=bars('Siswa Yatim per Markaz',group(y,x=>'Markaz '+x._mk));h+=bars('Siswa Yatim per Tingkat',group(y,x=>'Kelas '+x['Tingkat']),{order:TING.map(t=>'Kelas '+t)})}
 if(tab=='pegawai'){const p=d.filter(x=>x['Anak Pegawai']=='Ya');
  h+=bars('Anak Pegawai / Karyawan',group(d,x=>x['Anak Pegawai']=='Ya'?'Anak Pegawai/Karyawan':'Bukan Anak Pegawai'));
  h+=bars('Anak Pegawai per Markaz',group(p,x=>'Markaz '+x._mk));h+=bars('Anak Pegawai per Tingkat',group(p,x=>'Kelas '+x['Tingkat']),{order:TING.map(t=>'Kelas '+t)})}
 if(tab=='wilayah'){h+=xtab('Siswa per Kota/Kab',d,x=>title(x['Kota']),null,'Kota/Kab');h+=xtab('Siswa per Provinsi',d,x=>title(x['Provinsi']),null,'Provinsi')}
 $('#app').innerHTML=h+'</div>';if(tab=='siswa')drawDl()}
let lastY=0;
let curSub='';
function openM(t,list,sub){delete SORT.lst;curSub=sub||'';lastY=window.scrollY;curList=list.slice().sort((a,b)=>a['Nama'].localeCompare(b['Nama']));
 $('#app').innerHTML=`<div class="lv"><div class="lh"><button class="back" onclick="closeM()">← Kembali</button><div><h2>${esc(t)}</h2><small id="mc"></small></div></div><div class="lw" id="ml"></div></div>`;drawM();window.scrollTo(0,0)}
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const title=t=>(t||'').toLowerCase().replace(/(^|[\s\-\/(])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function tgl(v){v=(v||'').trim();let d,m,y,r;if(r=/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/.exec(v)){d=r[1];m=r[2];y=r[3]}else if(r=/^(\d{4})-(\d{2})-(\d{2})/.exec(v)){y=r[1];m=r[2];d=r[3]}else return v;
 if(!BLN[+m-1]||+y<1900)return v;return d.padStart(2,'0')+' '+BLN[+m-1]+' '+y}
const ttl=x=>[title(x['Tempat Lahir']),tgl(x['Tanggal Lahir'])].filter(Boolean).join(', ');
function alamat(x){const p=[],rt=x['RT'],rw=x['RW'];
 if(x['Alamat'])p.push(x['Alamat'].replace(/[,\s]+$/,''));
 if((rt&&+rt)||(rw&&+rw))p.push('RT '+(rt||'-')+'/RW '+(rw||'-'));
 if(x['Kelurahan']){const k=(x['Kota']||'').trim();p.push((!k?'Desa/Kel. ':/^kota\b/i.test(k)?'Kel. ':'Desa ')+title(x['Kelurahan']))}
 if(x['Kecamatan'])p.push('Kec. '+title(x['Kecamatan']));
 if(x['Kota'])p.push(title(x['Kota']));
 if(x['Provinsi'])p.push(title(x['Provinsi']));
 if(x['Kode Pos']&&+x['Kode Pos'])p.push('Kode Pos '+x['Kode Pos']);
 return p.join(', ')}
let qs='';
function renderCari(){$('#app').innerHTML=`<div class="srch"><input id="sq" type="search" placeholder="Ketik nama, NIS, NISN, atau NIK siswa…" value="${esc(qs)}" autocomplete="off"><div id="sr"></div></div>`;
 const i=$('#sq');i.oninput=()=>{qs=i.value;drawCari()};drawCari();i.focus()}
function drawCari(){const q=qs.trim().toLowerCase(),box=$('#sr');
 if(q.length<2){box.innerHTML=`<div class="msg">Ketik minimal 2 karakter untuk mencari di antara ${ALL.length} siswa.</div>`;return}
 const a=ALL.filter(x=>[x['Nama'],x['Nama Arab'],x['NIS'],x['NISN'],x['NIK']].join(' ').toLowerCase().includes(q)).sort((p,r)=>p['Nama'].localeCompare(r['Nama']));
 box.innerHTML=`<div class="cnt">${a.length} hasil${a.length>30?' · menampilkan 30 pertama, persempit pencarian':''}</div>`+a.slice(0,30).map(cardS).join('')}
function cardS(x){const f=(l,v,c)=>`<div class="f${c?' '+c:''}"><span>${l}</span><b${c=='w'?' dir="rtl"':''}>${esc(v)||'-'}</b></div>`;
 return `<div class="sc"><div class="sh"><h4>${esc(x['Nama'])}</h4><span class="bd">${x['Kelas']?'Kelas '+esc(x['Kelas'])+' · ':''}Markaz ${x._mk}</span></div><div class="fg">${f('NIS',x['NIS'])}${f('NISN',x['NISN'])}${f('NIK',x['NIK'])}${f('Nama',x['Nama'])}${f('Nama Arab',x['Nama Arab'],'w')}${f('Tempat, Tanggal Lahir',ttl(x))}${f('Nama Ayah',x['Nama Ayah'])}${f('Nama Ibu',x['Nama Ibu'])}${f('Alamat Lengkap',alamat(x),'full')}</div></div>`}
const dkey=x=>{const m=/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/.exec(x['Tanggal Lahir']||'');return m?m[3]+m[2].padStart(2,'0')+m[1].padStart(2,'0'):(x['Tanggal Lahir']||'')};
function lstHTML(id,list){const ep=tab=='pegawai'&&list.some(x=>x['Anak Pegawai']=='Ya');
 const cols=[['No'],['NISN',x=>x['NISN']],['Nama',x=>x['Nama']],['Tempat, Tanggal Lahir',dkey],['Kelas',x=>x['Kelas']],['Markaz',x=>x._mk],['JK',x=>x['Gender']]];if(ep)cols.push(['Nama Pegawai (Orang Tua)',x=>x['Nama Pegawai']]);
 const s=SORT[id];let a=list;
 if(s&&cols[s.c]&&cols[s.c][1]){const f=cols[s.c][1];a=list.slice().sort((p,q)=>{const A=f(p)||'',B=f(q)||'';if(!A&&B)return 1;if(A&&!B)return -1;return s.d*cmp(A,B)})}

 return bar+`<table class="lst"><tr>${cols.map((c,i)=>i?th(id,i,c[0],i==7?'ep':''):'<th>No</th>').join('')}</tr>${a.map((x,n)=>`<tr><td data-l="No">${n+1}</td><td data-l="NISN">${esc(x['NISN'])||'-'}</td><td class="nm" data-l="Nama">${esc(x['Nama'])}</td><td class="nw" data-l="TTL">${esc(ttl(x))||'-'}</td><td data-l="Kelas">${esc(x['Kelas'])||'-'}</td><td data-l="Markaz">${x._mk}</td><td data-l="JK" class="${x['Gender']}">${x['Gender']}</td>${ep?`<td class="ep" data-l="Orang Tua">${esc(x['Nama Pegawai'])||'-'}</td>`:''}</tr>`).join('')}</table>`}
